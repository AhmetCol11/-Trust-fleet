version: '3.8'

services:
  web:
    build: .
    container_name: trustfleet_web
    ports:
      - "5000:5000"
    volumes:
      - db_data:/app/data
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - SECRET_KEY=trustfleet-docker-secret-key-2026
      - DATABASE_PATH=/app/data/sofor_guvenlik.db
      - DATABASE_URL=sqlite:////app/data/sofor_guvenlik.db
    restart: always
    command: gunicorn --workers 2 --bind 0.0.0.0:5000 "run:app"

volumes:
  db_data:
