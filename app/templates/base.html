<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - TrustFleet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0e1117; color: #fafafa; font-family: 'Plus Jakarta Sans', 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .streamlit-container { max-width: 900px; margin: 40px auto; padding: 30px; background-color: #262730; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stButton>button { width: 100%; border-radius: 4px; border: 1px solid #ff4b4b; background-color: #ff4b4b; color: white; font-weight: bold; padding: 0.5rem 1rem; transition: all 0.3s; }
        .stButton>button:hover { background-color: #ff3333; border-color: #ff3333; }
        .nav-tabs .nav-link { color: #aaa; border: none; border-bottom: 2px solid transparent; }
        .nav-tabs .nav-link.active { color: #fff; background: transparent; border-color: transparent; border-bottom: 2px solid #ff4b4b; font-weight: bold; }
        
        /* Global High-Contrast Text Overrides for Dark Backgrounds */
        .text-secondary {
            color: #b2b6c1 !important;
        }
        .text-muted {
            color: #8c91a0 !important;
        }
    </style>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
</head>
<body>
    <!-- Premium Global Language Selector Widget -->
    <div class="global-language-selector" style="position: fixed; top: 20px; right: 20px; z-index: 2050;">
        <div class="btn-group btn-group-sm rounded bg-dark border border-secondary border-opacity-50 shadow-lg" role="group" style="padding: 3px; backdrop-filter: blur(12px); background: rgba(15, 17, 23, 0.75) !important;">
            <button type="button" id="globalLangTR" class="btn btn-sm py-1 px-3 border-0 fw-bold" onclick="changeLanguage('tr')" style="font-size: 0.8rem; border-radius: 6px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: rgba(255,255,255,0.6);">TR</button>
            <button type="button" id="globalLangEN" class="btn btn-sm py-1 px-3 border-0 fw-bold" onclick="changeLanguage('en')" style="font-size: 0.8rem; border-radius: 6px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: rgba(255,255,255,0.6);">EN</button>
        </div>
    </div>

    <script>
        function updateGlobalLangHighlight(lang) {
            const tr = document.getElementById('globalLangTR');
            const en = document.getElementById('globalLangEN');
            if (!tr || !en) return;
            
            if (lang === 'tr') {
                tr.style.background = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
                tr.style.color = '#0e1117';
                tr.style.boxShadow = '0 0 10px rgba(245, 158, 11, 0.4)';
                en.style.background = 'transparent';
                en.style.color = 'rgba(255, 255, 255, 0.6)';
                en.style.boxShadow = 'none';
            } else {
                en.style.background = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
                en.style.color = '#0e1117';
                en.style.boxShadow = '0 0 10px rgba(245, 158, 11, 0.4)';
                tr.style.background = 'transparent';
                tr.style.color = 'rgba(255, 255, 255, 0.6)';
                tr.style.boxShadow = 'none';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initial load check
            updateGlobalLangHighlight(window.currentLanguage || 'tr');
            
            // Event listener for language changes
            window.addEventListener('languageChanged', function(e) {
                updateGlobalLangHighlight(e.detail.lang);
            });
        });
    </script>

    <div class="container-fluid py-4">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
