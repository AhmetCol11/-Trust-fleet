<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - TrustFleet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0e1117; color: #fafafa; font-family: 'Plus Jakarta Sans', 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .streamlit-container { max-width: 900px; margin: 40px auto; padding: 30px; background-color: #262730; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stButton>button { width: 100%; border-radius: 4px; border: 1px solid #ff4b4b; background-color: #ff4b4b; color: white; font-weight: bold; padding: 0.5rem 1rem; transition: all 0.3s; }
        .stButton>button:hover { background-color: #ff3333; border-color: #ff3333; }
        .nav-tabs .nav-link { color: #aaa; border: none; border-bottom: 2px solid transparent; }
        .nav-tabs .nav-link.active { color: #fff; background: transparent; border-color: transparent; border-bottom: 2px solid #ff4b4b; font-weight: bold; }
        
        /* Global High-Contrast Text Overrides for Dark Backgrounds */
        .text-secondary {
            color: #b2b6c1 !important;
        }
        .text-muted {
            color: #8c91a0 !important;
        }
    </style>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
</head>
<body>
    <!-- Premium Global Language Selector Widget -->
    <div class="language-selector" style="position: fixed; top: 20px; right: 20px; z-index: 2000;">
        <div class="dropdown">
            <button class="btn dropdown-toggle border-secondary" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="background: rgba(30, 33, 41, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fafafa; font-weight: 600; font-size: 0.85rem; padding: 6px 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); transition: all 0.3s ease;">
                🌐 <span id="currentLangLabel">TR</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end border-secondary shadow-lg" aria-labelledby="langDropdown" style="background: rgba(30, 33, 41, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; min-width: 120px;">
                <li><a class="dropdown-item text-light py-2" href="#" onclick="changeLanguage('tr')" style="font-size: 0.85rem; font-weight: 500;"><span class="me-2">🇹🇷</span> Türkçe</a></li>
                <li><a class="dropdown-item text-light py-2" href="#" onclick="changeLanguage('en')" style="font-size: 0.85rem; font-weight: 500;"><span class="me-2">🇬🇧</span> English</a></li>
            </ul>
        </div>
    </div>

    <div class="container-fluid py-4">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
