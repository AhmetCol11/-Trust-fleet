{% extends "base.html" %}

{% block content %}
<div class="streamlit-container mt-5 text-center">
    <div class="py-5">
        <i class="fa-solid fa-triangle-exclamation fa-6x text-danger mb-4"></i>
        <h1 class="display-3 fw-bold text-danger">500</h1>
        <h3 class="mb-4 text-secondary">Beklenmedik Bir Sunucu Hatası</h3>
        <p class="text-muted fs-5 mb-5 mx-auto" style="max-width: 500px;">
            Sistemde beklenmeyen bir hata oluştu. Endişelenmeyin, veritabanı güvenliği için tüm işlemler geri alındı. Lütfen biraz sonra tekrar deneyin.
        </p>
        <div class="stButton d-inline-block" style="min-width: 200px;">
            <a href="{{ url_for('main.index') }}" class="btn py-2 fw-bold text-white" style="border: 1px solid #ff4b4b; background-color: #ff4b4b; text-decoration: none; display: block; border-radius: 4px;">
                <i class="fa-solid fa-home"></i> Ana Sayfaya Dön

    </div>
</div>
