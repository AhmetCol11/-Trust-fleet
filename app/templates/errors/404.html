{% extends "base.html" %}

    <div class="py-5">
        <i class="fa-solid fa-compass-slash fa-6x text-warning mb-4"></i>
        <h1 class="display-3 fw-bold text-light">404</h1>
        <h3 class="mb-4 text-secondary">Aradığınız Sayfa Bulunamadı</h3>

        <div class="stButton d-inline-block" style="min-width: 200px;">
